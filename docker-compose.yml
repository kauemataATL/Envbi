# Ambiente local: n8n + túnel público gratuito (Cloudflare) + InHire simulado
# Subir:   docker compose up -d
# Ver URL do túnel:   docker compose logs tunnel   (procure por https://....trycloudflare.com)
# Painel do InHire simulado: http://localhost:3000

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    restart: unless-stopped
    ports:
      - "5678:5678"
    env_file: .env
    environment:
      - GENERIC_TIMEZONE=America/Sao_Paulo
      - TZ=America/Sao_Paulo
      # Permite que os nós "Code" leiam/gravem os arquivos de /files (data/)
      - NODE_FUNCTION_ALLOW_BUILTIN=fs
      - N8N_RESTRICT_FILE_ACCESS_TO=/files
      # Permite usar {{ $env.VARIAVEL }} nos workflows (ok para protótipo local)
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
    volumes:
      - n8n_data:/home/node/.n8n
      - ./data:/files

  # InHire SIMULADO (mock-inhire/server.js): finge ser a API do ATS até termos a integração real.
  # Dentro do Docker o n8n acessa em http://inhire-mock:3000; no seu navegador, http://localhost:3000
  inhire-mock:
    image: node:22-alpine
    restart: unless-stopped
    command: node /app/server.js
    ports:
      - "3000:3000"
    environment:
      - TZ=America/Sao_Paulo
      - DATA_DIR=/data
      - INHIRE_API_TOKEN=${INHIRE_API_TOKEN}
      - INHIRE_WEBHOOK_SECRET=${INHIRE_WEBHOOK_SECRET}
      # Workflow 03 (precisa estar ativo). Para testar com o workflow aberto no editor, use /webhook-test/inhire
      - INHIRE_WEBHOOK_URL=${INHIRE_WEBHOOK_URL:-http://n8n:5678/webhook/inhire}
    volumes:
      - ./mock-inhire:/app:ro
      - ./data/inhire-mock:/data

  # Túnel gratuito: gera uma URL https pública que aponta para o n8n.
  # A URL muda toda vez que este container reinicia.
  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    # --protocol http2: usa TCP 443 (redes corporativas costumam bloquear o QUIC/UDP padrão)
    command: tunnel --no-autoupdate --protocol http2 --url http://n8n:5678
    depends_on:
      - n8n

volumes:
  n8n_data:
